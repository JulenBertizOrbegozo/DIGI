<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Cuenta | Clínica Dental San Cristóbal</title>
  <link rel="stylesheet" href="index.css"/>
  <style>
    .container {
      max-width: 450px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 0.7rem;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #218838;
    }

    .top-bar {
      text-align: right;
      padding: 0.5rem 1rem;
      background-color: #f8f8f8;
    }

    .login-area a {
      color: #0077cc;
      text-decoration: none;
    }

    .login-area a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="login-area">
        <a href="login.html">Iniciar sesión</a>
      </div>
    </div>
    <h1 style="text-align: center;">Crear Cuenta</h1>
  </header>

  <div class="container">
    <h2>Completa el formulario</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
      </div>
      <button type="submit">Crear cuenta</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Clínica Dental San Cristóbal - Todos los derechos reservados.
  </footer>

  <script>
    function obtenerUsuarios() {
      const usuarios = localStorage.getItem('usuarios');
      return usuarios ? JSON.parse(usuarios) : [];
    }

    function guardarUsuarios(usuarios) {
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
    }

    document.getElementById('registerForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (password !== confirmPassword) {
        alert("Las contraseñas no coinciden.");
        return;
      }

      const usuarios = obtenerUsuarios();
      const usuarioExistente = usuarios.find(user => user.email === email);

      if (usuarioExistente) {
        alert("Este correo ya está registrado. Inicia sesión.");
      } else {
        const nuevoUsuario = { name, email, password };
        usuarios.push(nuevoUsuario);
        guardarUsuarios(usuarios);

        alert("Cuenta creada exitosamente.");
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
